name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint · tipos · testes
    runs-on: ubuntu-latest
    env:
      PHONE_HASH_SALT: ci-only-salt-not-a-secret-0123456789
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      - name: Dependências
        run: uv sync --frozen

      - name: Gate completo (lint · tipos · testes com cobertura · invariantes)
        run: make check

      - name: Instalação via pip também funciona
        run: |
          python3 -m venv /tmp/pipenv && /tmp/pipenv/bin/pip install -q . && /tmp/pipenv/bin/python -c "import app; print(app.__version__)"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
