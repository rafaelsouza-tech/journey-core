name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint · tipos · testes
    runs-on: ubuntu-latest
    env:
      PHONE_HASH_SALT: ci-only-salt-not-a-secret-0123456789
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      - name: Dependências
        run: uv sync --frozen

      - name: Gate completo (lint · tipos · testes com cobertura · invariantes)
        run: make check

      - name: Instalação via pip também funciona
        run: |
          python3 -m venv /tmp/pipenv && /tmp/pipenv/bin/pip install -q . && /tmp/pipenv/bin/python -c "import app; print(app.__version__)"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.24.3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Varre o histórico completo (não só o intervalo do push): a action oficial monta
      # `primeiro-commit^..HEAD` e falha no primeiro push de um repositório.
      - name: Instalar gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Varredura de segredos no histórico
        run: gitleaks git --no-banner --redact --exit-code 1 .
